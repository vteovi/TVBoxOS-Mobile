name: Build APK

# 在线打包：不需要本地 Android 环境
#   push 到 main / 手动运行  -> 产出两个架构的 APK（Artifacts 可下载）
#   打 v* 标签              -> 产出正式包并自动发布 Release + 更新 update.json
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    # 打标签时走下面的发布任务，这里只处理分支/手动构建
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: echo "version=$(sed -nE "s/^[[:space:]]*versionName '([^']+)'/\1/p" app/build.gradle)" >> "$GITHUB_OUTPUT"

      # 有签名密钥就出可直接覆盖安装的 release 包；没有就先出 debug 包，方便先跑通流程
      - name: Restore signing key
        id: signing
        env:
          TVBOX_KEYSTORE_BASE64: ${{ secrets.TVBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$TVBOX_KEYSTORE_BASE64" ]; then
            printf '%s' "$TVBOX_KEYSTORE_BASE64" | base64 --decode > TVBoxOSC.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::已加载签名密钥，本次构建已签名的 release 包"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 TVBOX_KEYSTORE_BASE64，本次构建 debug 包。配置密钥后可直接产出可覆盖安装的 release 包。"
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        env:
          TVBOX_KEY_ALIAS: ${{ secrets.TVBOX_KEY_ALIAS }}
          TVBOX_KEY_PASSWORD: ${{ secrets.TVBOX_KEY_PASSWORD }}
          TVBOX_STORE_PASSWORD: ${{ secrets.TVBOX_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build/gradle-build.log

      - name: Build debug APK
        if: steps.signing.outputs.signed != 'true'
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build/gradle-build.log

      - name: Report Gradle failure
        if: failure()
        run: |
          log=build/gradle-build.log
          if [ ! -f "$log" ]; then
            echo "::error title=Build failure::构建没有走到 Gradle 阶段，请查看上方日志"
            exit 0
          fi
          failure_line=$(grep -m 1 -E 'Execution failed for task|^e: | error: ' "$log" || true)
          if [ -z "$failure_line" ]; then
            failure_line=$(tail -n 1 "$log")
          fi
          echo "::error title=Gradle build failure::$failure_line"

      - name: Verify APK output
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          variant=debug
          if [ "$SIGNED" = "true" ]; then variant=release; fi
          mapfile -t apks < <(ls app/build/outputs/apk/*/"$variant"/*.apk 2>/dev/null || true)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::未找到构建产物（variant=$variant）"
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in "${apks[@]}"; do
            echo "== $(basename "$apk") =="
            echo "   size: $(du -h "$apk" | cut -f1)"
            unzip -l "$apk" | grep -Eo 'lib/[A-Za-z0-9_-]+/' | sort -u | sed 's/^/   abi : /'
            if [ "$SIGNED" = "true" ]; then
              "$apksigner" verify --print-certs "$apk" | head -n 3 | sed 's/^/   /'
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Mobile-v${{ steps.version.outputs.version }}-${{ steps.signing.outputs.signed == 'true' && 'release' || 'debug' }}
          path: |
            app/build/outputs/apk/**/release/*.apk
            app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Mobile-gradle-reports
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-Mobile-build-log
          path: build/gradle-build.log
          if-no-files-found: warn
          retention-days: 14

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          app_version=$(sed -nE "s/^[[:space:]]*versionName '([^']+)'/\1/p" app/build.gradle)
          if [ "$app_version" != "$version" ]; then
            echo "::error::Tag ${TAG_NAME} does not match app version ${app_version}"
            exit 1
          fi

      - name: Restore release signing key
        env:
          TVBOX_KEYSTORE_BASE64: ${{ secrets.TVBOX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TVBOX_KEYSTORE_BASE64" ]; then
            echo "::error::Missing TVBOX_KEYSTORE_BASE64. Configure the fixed signing key before publishing a release."
            exit 1
          fi
          printf '%s' "$TVBOX_KEYSTORE_BASE64" | base64 --decode > TVBoxOSC.jks

      - name: Build signed release APK
        env:
          TVBOX_KEY_ALIAS: ${{ secrets.TVBOX_KEY_ALIAS }}
          TVBOX_KEY_PASSWORD: ${{ secrets.TVBOX_KEY_PASSWORD }}
          TVBOX_STORE_PASSWORD: ${{ secrets.TVBOX_STORE_PASSWORD }}
        run: |
          chmod +x gradlew
          mkdir -p build
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon 2>&1 | tee build/gradle-build.log

      - name: Verify signed APKs
        run: |
          mapfile -t apks < <(ls app/build/outputs/apk/*/release/*.apk 2>/dev/null || true)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::未找到 release 产物，检查 flavor 与 outputFileName 配置"
            exit 1
          fi
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          for apk in "${apks[@]}"; do
            echo "== $(basename "$apk") ($(du -h "$apk" | cut -f1)) =="
            unzip -l "$apk" | grep -Eo 'lib/[A-Za-z0-9_-]+/' | sort -u | sed 's/^/   abi : /'
            "$apksigner" verify --print-certs "$apk" | head -n 3 | sed 's/^/   /'
          done

      - name: Create update manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          GITHUB_REPOSITORY="${{ github.repository }}" ./scripts/sync_release_metadata.sh "$TAG_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/**/release/*.apk
            update.json

      - name: Publish update manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          GITHUB_REPOSITORY="${{ github.repository }}" ./scripts/sync_release_metadata.sh --skip-version-check "$TAG_NAME"
          if git diff --quiet -- update.json README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json README.md
          git commit -m "chore: sync release metadata for ${TAG_NAME} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "::error::Unable to publish update manifest after three attempts"
          exit 1
